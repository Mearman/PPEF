[project]
name = "ppef"
version = "2.0.0"
description = "Portable Programmatic Evaluation Framework - Claim-driven, deterministic evaluation"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pyright>=1.1",
    "ruff>=0.9",
]

[project.scripts]
ppef = "ppef.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppef"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end integration tests against example experiments",
]
